name: extract-first

on:
  workflow_dispatch:
  push:
    paths:
      - "02-extract-first/**"
      - ".github/workflows/extract-first.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 02-extract-first
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Each variant twice, runs must match
        run: |
          for v in copy calls joins; do
            python extract_test.py $v | tee run1.txt
            python extract_test.py $v | diff run1.txt -
          done
      - name: Scale, twice
        run: |
          python scale.py | tee scale1.txt
          python scale.py | diff scale1.txt -
