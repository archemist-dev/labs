name: extract-first

on:
  workflow_dispatch:
  push:
    paths:
      - "02-extract-first/**"
      - ".github/workflows/extract-first.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 02-extract-first
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 1
        run: python extract_test.py | tee run1.txt
      - name: Run 2, must match run 1
        run: python extract_test.py | diff run1.txt -
